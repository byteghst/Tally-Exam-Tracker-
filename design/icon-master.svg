<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C9CFB"/>
      <stop offset="1" stop-color="#4A72D8"/>
    </linearGradient>
  </defs>

  <!-- solid edge-to-edge background so this works as a maskable icon -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- content kept within the ~80% safe zone (roughly 51px margin) for maskable cropping -->
  <g transform="translate(256 256)">
    <!-- clipboard body -->
    <rect x="-110" y="-140" width="220" height="280" rx="28" fill="#F5F8FF" opacity="0.98"/>
    <!-- clip tab -->
    <rect x="-40" y="-160" width="80" height="40" rx="12" fill="#EAF0FF"/>

    <!-- checklist rows -->
    <g stroke="#4A72D8" stroke-width="14" stroke-linecap="round">
      <line x1="-70" y1="-70" x2="70" y2="-70"/>
      <line x1="-70" y1="-10" x2="70" y2="-10"/>
      <line x1="-70" y1="50" x2="30" y2="50"/>
    </g>

    <!-- checkmark badge -->
    <circle cx="62" cy="88" r="46" fill="#3EBD7E"/>
    <path d="M 40 88 L 55 103 L 86 70" stroke="#F5F8FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
